<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acervo Bibliográfico Inteligente</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        text-align: center;
        color: white;
        margin-bottom: 30px;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h2 {
        color: #4e73df;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        background-color: #4e73df;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #2e59d9;
    }

    .resultado {
        margin-top: 15px;
        padding: 10px;
        background-color: #f8f9fc;
        border-radius: 8px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Sistema de Acervo Bibliográfico Inteligente</h1>

    <div class="card">
        <h2>Cadastro de Livro</h2>

        <input type="text" id="codigoLivro" placeholder="Código">
        <input type="text" id="tituloLivro" placeholder="Título">
        <input type="text" id="autorLivro" placeholder="Autor">
        <input type="number" id="anoLivro" placeholder="Ano do Livro">
        <input type="text" id="editoraLivro" placeholder="Editora">
        <input type="text" id="localizacaoLivro" placeholder="Localização">

        <select id="statusLivro">
            <option>Não emprestado</option>
            <option>Emprestado</option>
        </select>

        <button onclick="cadastrarLivro()">Cadastrar Livro</button>

        <div class="resultado" id="resultadoLivro"></div>
    </div>

    <div class="card">
        <h2>Cadastro de Usuário</h2>

        <input type="text" id="codigoUsuario" placeholder="Código">
        <input type="text" id="nomeUsuario" placeholder="Nome">
        <input type="text" id="cpfUsuario" placeholder="CPF">
        <input type="text" id="enderecoUsuario" placeholder="Endereço">
        <input type="text" id="telefoneUsuario" placeholder="Telefone">
        <input type="text" id="turmaUsuario" placeholder="Código da Turma">

        <button onclick="cadastrarUsuario()">Cadastrar Usuário</button>

        <div class="resultado" id="resultadoUsuario"></div>
    </div>

</div>

<script>
    function cadastrarLivro() {

        const livro = {
            codigo: document.getElementById("codigoLivro").value,
            titulo: document.getElementById("tituloLivro").value,
            autor: document.getElementById("autorLivro").value,
            ano: document.getElementById("anoLivro").value,
            editora: document.getElementById("editoraLivro").value,
            localizacao: document.getElementById("localizacaoLivro").value,
            status: document.getElementById("statusLivro").value
        };

        document.getElementById("resultadoLivro").innerHTML = `
            <strong>Livro cadastrado com sucesso!</strong><br><br>
            Código: ${livro.codigo}<br>
            Título: ${livro.titulo}<br>
            Autor: ${livro.autor}<br>
            Ano: ${livro.ano}<br>
            Editora: ${livro.editora}<br>
            Localização: ${livro.localizacao}<br>
            Status: ${livro.status}
        `;
    }

    function cadastrarUsuario() {

        const usuario = {
            codigo: document.getElementById("codigoUsuario").value,
            nome: document.getElementById("nomeUsuario").value,
            cpf: document.getElementById("cpfUsuario").value,
            endereco: document.getElementById("enderecoUsuario").value,
            telefone: document.getElementById("telefoneUsuario").value,
            turma: document.getElementById("turmaUsuario").value
        };

        document.getElementById("resultadoUsuario").innerHTML = `
            <strong>Usuário cadastrado com sucesso!</strong><br><br>
            Código: ${usuario.codigo}<br>
            Nome: ${usuario.nome}<br>
            CPF: ${usuario.cpf}<br>
            Endereço: ${usuario.endereco}<br>
            Telefone: ${usuario.telefone}<br>
            Código da Turma: ${usuario.turma}
        `;
    }
</script>

</body>
</html>
